<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consentimiento de Cookies</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javaScrip.js" defer></script>
</head>

<body>

    <!-- Contenedor principal de la página -->
    <main class="pagina-web">

        <header class="encabezado">
            <span>⬜ MI PÁGINA</span>
            <span>INICIO &nbsp; MENÚ</span>
        </header>

        <div class="bloque"></div>
        <div class="bloque bloque-pequeno"></div>

        <section class="contenido">
            <div class="texto-ejemplo">
                TEXTO DE EJEMPLO<br> CONTENIDO DE LA PÁGINA<br> INFORMACIÓN GENERAL<br> MÁS INFORMACIÓN
            </div>

            <div class="texto-ejemplo">
                CONTENIDO<br> TEXTO DE EJEMPLO<br> INFORMACIÓN
            </div>
        </section>

        <div class="cuadros">
            <div class="cuadro"></div>
            <div class="cuadro"></div>
        </div>

    </main>

    <!-- Ventana de consentimiento de cookies -->
    <div class="ventana-cookies" id="ventanaCookies">

        <button class="boton-cerrar" id="botonCerrar" aria-label="Cerrar aviso">×</button>

        <div class="icono-galleta" aria-hidden="true">🍪</div>

        <p class="mensaje-cookies">
            Utilizamos cookies para mejorar tu experiencia de usuario.
        </p>

        <button class="boton-aceptar" id="botonAceptar">
            Aceptar cookies
        </button>

    </div>

</body>

</html>
